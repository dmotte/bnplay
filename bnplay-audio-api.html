<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>BNPlay - Audio API version</title>

    <link rel="icon" href="favicon.png" />

    <style type="text/css">
      :root {
        color-scheme: light dark;

        --btn-bg: #eee;
        --btn-text: #000;
        --btn-border: #888;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --btn-bg: #000;
          --btn-text: #ccc;
          --btn-border: #888;
        }
      }

      body,
      td,
      th {
        font-family: sans-serif;
      }

      #dialogMsg::backdrop {
        background-color: #1118;
        backdrop-filter: blur(3px);
      }

      .text-center {
        text-align: center;
      }

      .text-minor {
        font-size: 14px;
        color: #888;
      }

      .btn-ctrl {
        background-color: var(--btn-bg);
        color: var(--btn-text);
        border: 1px solid var(--btn-border);
        padding: 20px 30px;
        font-weight: bold;
      }
    </style>

    <script type="module">
      /** Brown Noise Player */
      class BNP {
        static audioData;

        static audioCtx = new AudioContext();
        static nodeSource = null;
        static nodeGain = null;

        static volume = 1;

        ////////////////////////////////////////////////////////////////////////

        static async getSampleFromWeb() {
          const response = await fetch(
            // This URL has CORS enabled
            "https://dmotte.github.io/bnplay/bn-sample.flac",
          );

          if (!response.ok) throw new Error("HTTP error " + response.status);

          return await response.arrayBuffer();
        }

        static async getSample() {
          const dbName = "bnplay-cache",
            storeName = "files",
            itemName = "bn-sample.flac";

          const db = await new Promise((resolve, reject) => {
            const req = indexedDB.open(dbName, 1);

            req.onerror = (event) =>
              reject(new Error(`Error opening IndexedDB database ${dbName}`));

            req.onupgradeneeded = (event) => {
              const db = event.target.result;
              if (!db.objectStoreNames.contains(storeName))
                db.createObjectStore(storeName);
            };

            req.onsuccess = (event) => resolve(event.target.result);
          });

          const transaction = db.transaction(storeName, "readonly");
          const store = transaction.objectStore(storeName);
          let buffer = await new Promise((resolve, reject) => {
            const req = store.get(itemName);

            req.onerror = (event) =>
              reject(
                new Error(
                  `Error getting item ${itemName} from store ${storeName} from IndexedDB database ${dbName}`,
                ),
              );

            req.onsuccess = (event) => resolve(event.target.result);
          });

          if (!buffer) {
            buffer = await this.getSampleFromWeb();

            // We cache the audio file indefinitely because we assume that it
            // will never change
            const transaction = db.transaction(storeName, "readwrite");
            const store = transaction.objectStore(storeName);
            store.put(buffer, itemName);
          }

          return buffer;
        }

        static async initialize() {
          this.audioData = await this.audioCtx.decodeAudioData(
            await this.getSample(),
          );

          this.nodeGain = this.audioCtx.createGain();
          this.nodeGain.gain.setValueAtTime(
            this.volume,
            this.audioCtx.currentTime,
          );
          this.nodeGain.connect(this.audioCtx.destination);
        }

        ////////////////////////////////////////////////////////////////////////

        static isPlaying() {
          return this.nodeSource !== null;
        }

        static play() {
          if (this.isPlaying()) return;

          this.nodeSource = new AudioBufferSourceNode(this.audioCtx);
          this.nodeSource.buffer = this.audioData;
          this.nodeSource.connect(this.nodeGain);
          this.nodeSource.loop = true;
          this.nodeSource.start();
        }

        static stop() {
          if (!this.isPlaying()) return;

          this.nodeSource.stop();
          this.nodeSource = null;
        }

        static toggle() {
          if (this.isPlaying()) this.stop();
          else this.play();
        }

        ////////////////////////////////////////////////////////////////////////

        static getVolume() {
          return this.volume;
        }

        static setVolume(value) {
          this.volume = value;

          this.nodeGain.gain.linearRampToValueAtTime(
            this.volume,
            this.audioCtx.currentTime + 0.01,
          );
        }
      }

      class App {
        static showModalMsg(msg = "") {
          const dialogMsg = document.getElementById("dialogMsg");

          if (msg === "") {
            dialogMsg.close();
            return;
          }

          dialogMsg.textContent = msg;
          dialogMsg.showModal();
        }

        ////////////////////////////////////////////////////////////////////////

        static update() {
          const btnToggle = document.getElementById("btnToggle"),
            spanStatus = document.getElementById("spanStatus");

          if (BNP.isPlaying()) {
            spanStatus.textContent = "Playing...";
            document.title = "BNPlay - Playing";
            btnToggle.value = "\u23F9  STOP";
            if (navigator.mediaSession)
              navigator.mediaSession.playbackState = "playing";
          } else {
            spanStatus.textContent = "Stopped.";
            document.title = "BNPlay - Stopped";
            btnToggle.value = "\u25B6  PLAY";
            if (navigator.mediaSession)
              navigator.mediaSession.playbackState = "paused";
          }
        }

        ////////////////////////////////////////////////////////////////////////

        static body_onload() {
          window.addEventListener("error", (event) => {
            this.showModalMsg(`ERROR: ${event.error}`);
          });

          window.addEventListener("unhandledrejection", (event) => {
            this.showModalMsg(`ERROR: ${event.reason}`);
          });

          // Show the page body only when loaded, to prevent
          // the user from interacting early
          document.body.hidden = false;

          this.showModalMsg("Initializing...");

          (async () => {
            await BNP.initialize();

            this.update();

            if ("mediaSession" in navigator) {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: "BNPlay",
                artist: "dmotte",
                album: "BNPlay",
                artwork: [
                  {
                    src: "icon-128.png",
                    sizes: "128x128",
                    type: "image/png",
                  },
                  {
                    src: "icon-512.png",
                    sizes: "512x512",
                    type: "image/png",
                  },
                ],
              });

              navigator.mediaSession.setActionHandler("play", () => {
                const dialogMsg = document.getElementById("dialogMsg");
                if (dialogMsg.open) return;

                BNP.play();
                this.update();
              });

              navigator.mediaSession.setActionHandler("pause", () => {
                const dialogMsg = document.getElementById("dialogMsg");
                if (dialogMsg.open) return;

                BNP.stop();
                this.update();
              });

              navigator.mediaSession.setActionHandler("stop", () => {
                const dialogMsg = document.getElementById("dialogMsg");
                if (dialogMsg.open) return;

                BNP.stop();
                this.update();
              });
            }

            this.showModalMsg();
          })();
        }

        static body_onkeydown(event) {
          const dialogMsg = document.getElementById("dialogMsg");

          if (dialogMsg.open) return;

          const btnToggle = document.getElementById("btnToggle"),
            rangeVolume = document.getElementById("rangeVolume");

          switch (event.key) {
            case " ":
              btnToggle.click();
              break;
            case "ArrowUp":
              rangeVolume.value = BNP.getVolume() + 0.05;
              rangeVolume.dispatchEvent(new Event("input", { bubbles: true }));
              break;
            case "ArrowDown":
              rangeVolume.value = BNP.getVolume() - 0.05;
              rangeVolume.dispatchEvent(new Event("input", { bubbles: true }));
              break;
          }
        }

        static btnToggle_onclick() {
          BNP.toggle();
          this.update();
        }

        static rangeVolume_oninput() {
          const rangeVolume = document.getElementById("rangeVolume"),
            spanVolPercent = document.getElementById("spanVolPercent");

          const value = parseFloat(rangeVolume.value);

          BNP.setVolume(value);

          spanVolPercent.textContent = Math.floor(value * 100);
        }
      }

      window.App = App;
    </script>
  </head>

  <body hidden onload="App.body_onload()" onkeydown="App.body_onkeydown(event)">
    <div class="text-center">
      <h1>&#x1F50A; BNPlay</h1>

      <p>&#x1F3A7; <i>Audio API version</i></p>

      <p style="margin: 30px 0 30px 0">
        <span id="spanStatus" class="text-minor"></span>
      </p>

      <p>
        <input
          type="button"
          id="btnToggle"
          class="btn-ctrl"
          onfocus="this.blur()"
          onclick="App.btnToggle_onclick()"
        />
      </p>

      <p>
        <input
          type="range"
          id="rangeVolume"
          step="0.05"
          min="0"
          max="1"
          value="1"
          style="width: 150px"
          oninput="App.rangeVolume_oninput()"
        />
        <br />
        <span class="text-minor">
          Volume <span id="spanVolPercent">100</span> %
        </span>
      </p>
    </div>

    <dialog id="dialogMsg" closedby="none"></dialog>
  </body>
</html>
