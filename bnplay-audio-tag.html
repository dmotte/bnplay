<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>BNPlay - audio tag version</title>

    <link rel="icon" href="favicon.png" />

    <style type="text/css">
      :root {
        color-scheme: light dark;

        --btn-bg: #eee;
        --btn-text: #000;
        --btn-border: #888;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --btn-bg: #000;
          --btn-text: #ccc;
          --btn-border: #888;
        }
      }

      body,
      td,
      th {
        font-family: sans-serif;
      }

      #dialogMsg::backdrop {
        background-color: #1118;
        backdrop-filter: blur(3px);
      }

      .text-center {
        text-align: center;
      }

      .text-minor {
        font-size: 14px;
        color: #888;
      }

      .btn-ctrl {
        background-color: var(--btn-bg);
        color: var(--btn-text);
        border: 1px solid var(--btn-border);
        padding: 20px 30px;
        font-weight: bold;
      }
    </style>

    <script type="module">
      /** Brown Noise Player */
      class BNP {
        static player1;
        static player2;
        static switchSeconds = 60;

        static timer;
        static timerMillis = 10_000;

        ////////////////////////////////////////////////////////////////////////

        /** Returns players by status (active/inactive) */
        static getPlayers() {
          const scenario12 = { active: this.player1, inactive: this.player2 },
            scenario21 = { active: this.player2, inactive: this.player1 };

          if (this.player1.paused && !this.player2.paused) return scenario21;

          if (!this.player1.paused && this.player2.paused) return scenario12;

          if (this.player1.paused && this.player2.paused)
            return this.player2.currentTime < this.player1.currentTime
              ? scenario21
              : scenario12;

          throw new Error("Both players are playing");
        }

        static switchPlayer() {
          const { active, inactive } = this.getPlayers();

          if (active.paused) {
            active.currentTime = 0;
            inactive.currentTime = 0;
            return Promise.resolve();
          }

          const result = inactive.play();
          active.pause();
          active.currentTime = 0;
          return result;
        }

        static initialize(player1, player2, callbackUpdate) {
          this.player1 = player1;
          this.player2 = player2;

          for (const player of [player1, player2]) {
            player.addEventListener("ended", callbackUpdate);
            player.addEventListener("play", callbackUpdate);
            player.addEventListener("pause", callbackUpdate);
          }

          callbackUpdate();

          // We need to use an arrow function here, otherwise "this"
          // would be undefined inside the function
          this.timer = setInterval(() => {
            const { active, inactive } = this.getPlayers();

            console.info("Players state before timer run: %o", {
              active,
              activeT: active.currentTime,
              inactiveT: inactive.currentTime,
            });

            if (active.currentTime >= this.switchSeconds)
              return this.switchPlayer();
          }, this.timerMillis);
        }

        ////////////////////////////////////////////////////////////////////////

        static isPlaying() {
          return !this.getPlayers().active.paused;
        }

        static play() {
          if (this.isPlaying()) return Promise.resolve();

          this.player1.currentTime = 0;
          this.player2.currentTime = 0;
          return this.player1.play();
        }

        static stop() {
          if (!this.isPlaying()) return;

          this.player1.pause();
          this.player2.pause();
          this.player1.currentTime = 0;
          this.player2.currentTime = 0;
        }

        static toggle() {
          if (this.isPlaying()) {
            this.stop();
            return Promise.resolve();
          } else return this.play();
        }

        ////////////////////////////////////////////////////////////////////////

        static getVolume() {
          return this.player1.volume;
        }

        static setVolume(value) {
          this.player1.volume = value;
          this.player2.volume = value;
        }
      }

      class App {
        static showModalMsg(msg = "") {
          const dialogMsg = document.getElementById("dialogMsg");

          if (msg === "") {
            dialogMsg.close();
            return;
          }

          dialogMsg.textContent = msg;
          dialogMsg.showModal();
        }

        ////////////////////////////////////////////////////////////////////////

        static update() {
          const btnToggle = document.getElementById("btnToggle"),
            spanStatus = document.getElementById("spanStatus");

          if (BNP.isPlaying()) {
            spanStatus.textContent = "Playing...";
            document.title = "BNPlay - Playing";
            btnToggle.value = "\u23F9  STOP";
          } else {
            spanStatus.textContent = "Stopped.";
            document.title = "BNPlay - Stopped";
            btnToggle.value = "\u25B6  PLAY";
          }
        }

        ////////////////////////////////////////////////////////////////////////

        static body_onload() {
          window.addEventListener("error", (event) => {
            this.showModalMsg(`ERROR: ${event.error}`);
          });

          window.addEventListener("unhandledrejection", (event) => {
            this.showModalMsg(`ERROR: ${event.reason}`);
          });

          // Show the page body only when loaded, to prevent
          // the user from interacting early
          document.body.hidden = false;

          BNP.initialize(
            document.getElementById("player1"),
            document.getElementById("player2"),
            this.update,
          );
        }

        static body_onkeydown(event) {
          const dialogMsg = document.getElementById("dialogMsg");

          if (dialogMsg.open) return;

          const btnToggle = document.getElementById("btnToggle"),
            rangeVolume = document.getElementById("rangeVolume");

          switch (event.key) {
            case " ":
              btnToggle.click();
              break;
            case "ArrowUp":
              rangeVolume.value = BNP.getVolume() + 0.05;
              rangeVolume.dispatchEvent(new Event("input", { bubbles: true }));
              break;
            case "ArrowDown":
              rangeVolume.value = BNP.getVolume() - 0.05;
              rangeVolume.dispatchEvent(new Event("input", { bubbles: true }));
              break;
          }
        }

        static btnToggle_onclick() {
          this.showModalMsg("Toggling playback state...");

          (async () => {
            await BNP.toggle();

            this.showModalMsg();
          })();
        }

        static rangeVolume_oninput() {
          const rangeVolume = document.getElementById("rangeVolume"),
            spanVolPercent = document.getElementById("spanVolPercent");

          const value = parseFloat(rangeVolume.value);

          BNP.setVolume(value);

          spanVolPercent.textContent = Math.floor(value * 100);
        }
      }

      window.App = App;
    </script>
  </head>

  <body hidden onload="App.body_onload()" onkeydown="App.body_onkeydown(event)">
    <audio hidden id="player1">
      <source src="https://dmotte.github.io/bnplay/bn-sample.flac" />
      Your browser does not support the HTML5 audio element
    </audio>
    <audio hidden id="player2">
      <source src="https://dmotte.github.io/bnplay/bn-sample.flac" />
      Your browser does not support the HTML5 audio element
    </audio>

    <div class="text-center">
      <h1>&#x1F50A; BNPlay</h1>

      <p>&#x1F3A7; <i>Audio tag version</i></p>

      <p style="margin: 30px 0 30px 0">
        <span id="spanStatus" class="text-minor"></span>
      </p>

      <p>
        <input
          type="button"
          id="btnToggle"
          class="btn-ctrl"
          onfocus="this.blur()"
          onclick="App.btnToggle_onclick()"
        />
      </p>

      <p>
        <input
          type="range"
          id="rangeVolume"
          step="0.05"
          min="0"
          max="1"
          value="1"
          style="width: 150px"
          oninput="App.rangeVolume_oninput()"
        />
        <br />
        <span class="text-minor">
          Volume <span id="spanVolPercent">100</span> %
        </span>
      </p>
    </div>

    <dialog id="dialogMsg" closedby="none"></dialog>
  </body>
</html>
